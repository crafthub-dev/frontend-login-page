<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Assignment 1</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="card">
    <!-- sign in form -->
    <div id="signInView">
      <h2 class="card-title">Login</h2>

      <form id="signInForm">
        <div class="form-group">
          <label for="signin-email">Email Address</label>
          <input type="email" id="signin-email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="signin-password">Password</label>
            <a href="javascript:void(0)" class="forgot-link" id="forgotBtn">Forgot password?</a>
          </div>
          <div class="input-container">
            <input type="password" id="signin-password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="eye-toggle" data-target="signin-password">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <span>Login</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="switch-auth">
        Don't have an account? <a href="#" id="toSignUp">Create Account</a>
      </div>
    </div>

    <!-- register / sign up -->
    <div id="signUpView" class="hidden">
      <h2 class="card-title">Sign Up</h2>

      <form id="signUpForm">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Muhammad Ali" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="user@gmail.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <div class="input-container">
            <input type="password" id="signup-password" placeholder="Enter password" required autocomplete="new-password">
            <button type="button" class="eye-toggle" data-target="signup-password">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <div class="input-container">
            <input type="password" id="signup-confirm-password" placeholder="Repeat your password" required autocomplete="new-password">
            <button type="button" class="eye-toggle" data-target="signup-confirm-password">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <span>Create Account</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="switch-auth">
        Already have an account? <a href="#" id="toSignIn">Sign in</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
